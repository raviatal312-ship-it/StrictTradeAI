workflows:
  stricttrade-android-debug:
    name: StrictTrade AI Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install Gradle 8.11.1
        script: |
          cd "$CM_BUILD_DIR"
          curl -L --fail --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q -o gradle.zip
      - name: Build Android debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          "$CM_BUILD_DIR/gradle-8.11.1/bin/gradle" assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
